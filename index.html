<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci</title>
    <!-- favicon -->
    <link rel="icon" href="./assets/img/favicon.ico" type="image/png">
    <!-- import CSS -->
    <link rel="stylesheet" href="./assets/CSS/style.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="container">
        <!-- tittle -->
        <div class="row m-3">
            <h1 class="fs-1">Fibonacci Sequence</h1>
        </div>
        <!-- informative text for input -->
        <div class="row m-5">
            <label for="number">Enter a natural number:</label>
        </div>
        <div class="row m-5 d-flex justify-content-center">
            <!-- input type number -->
            <div class="col-md-2 m-2 d-flex justify-content-center"><input type="number" id="number" placeholder="0" min="0" max="1000000"></div>
            <!-- button -->
            <div class="col-md-2 m-2 d-flex justify-content-center"><button id="btn" class="btn btn-success hover-grow" onclick="main()">Calculate</button></div>
        </div>
        <!-- display the sequence -->
        <div class="row m-3 d-flex justify-content-center" id="result"></div>
    </div>

    <script src="./assets/JS/script.js"></script>
</body>
</html>
